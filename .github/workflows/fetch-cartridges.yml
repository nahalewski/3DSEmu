name: Fetch cartridge art

# Downloads every image in Bulbapedia's archives "Game cartridges" category
# (https://archives.bulbagarden.net/wiki/Category:Game_cartridges) and
# commits them to the cartridge-art branch, where the 3D cartridges' labels
# and shell colours are cut from them.
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/fetch-cartridges.yml

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Download the category
        run: |
          mkdir -p art
          python3 - <<'PY'
          import json, os, time, urllib.parse, urllib.request
          API = "https://archives.bulbagarden.net/w/api.php"
          UA = {"User-Agent": "gen1recomp-Fold cartridge art fetch (github.com/nahalewski/3dsfoldrecomp)"}
          def get(params):
              url = API + "?" + urllib.parse.urlencode(params)
              req = urllib.request.Request(url, headers=UA)
              return json.load(urllib.request.urlopen(req, timeout=60))
          files, cont = [], {}
          while True:
              q = {"action": "query", "format": "json", "generator": "categorymembers",
                   "gcmtitle": "Category:Game_cartridges", "gcmtype": "file", "gcmlimit": "50",
                   "prop": "imageinfo", "iiprop": "url|size|mime"}
              q.update(cont)
              data = get(q)
              for page in (data.get("query", {}).get("pages", {}) or {}).values():
                  info = (page.get("imageinfo") or [{}])[0]
                  if info.get("url"):
                      files.append((page["title"], info["url"]))
              if "continue" not in data:
                  break
              cont = data["continue"]
              time.sleep(1)
          print(len(files), "files")
          index = []
          for title, url in sorted(files):
              name = title.split(":", 1)[1].replace(" ", "_").replace("/", "_")
              path = os.path.join("art", name)
              try:
                  req = urllib.request.Request(url, headers=UA)
                  open(path, "wb").write(urllib.request.urlopen(req, timeout=60).read())
                  index.append(name + "\t" + url)
              except Exception as e:
                  print("skip", name, e)
              time.sleep(0.3)
          open("art/INDEX.tsv", "w").write("\n".join(index) + "\n")
          PY
          ls art | head -50
          du -sh art
      - name: Commit to the cartridge-art branch
        run: |
          cd art
          git init -q
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout -q -b cartridge-art
          git add -A
          git commit -qm "Cartridge photos from Bulbapedia's archives (Category:Game cartridges)"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" cartridge-art
