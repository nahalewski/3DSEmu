# Builds the gen1recomp Fold APK on every push to main, every 12 hours, or by
# hand from the Actions tab, and attaches it to a GitHub Release, so it can be downloaded
# straight to the phone.  Signed with ci/debug.keystore, a fixed debug key
# (not a secret), so each new build installs over the last one.
name: Build APK

on:
  push:
    branches: [main, pixel-fold]
  workflow_dispatch:
  # every 12 hours (00:00 and 12:00 UTC), on the default branch -- picks up
  # the latest community mod catalog even when nothing here changed
  schedule:
    - cron: '0 */12 * * *'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK packages (API 36, build-tools 36, NDK 25.2)
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "platforms;android-36" "build-tools;36.0.0" "ndk;25.2.9519653" > /dev/null
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/25.2.9519653" >> "$GITHUB_ENV"

      - name: Debug signing key
        run: |
          mkdir -p ~/.android
          cp ci/debug.keystore ~/.android/debug.keystore

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('apply.sh') }}

      - name: Build
        run: ./apply.sh

      - name: Collect the APK
        id: apk
        run: |
          src=$(ls build/gen1recomp/dist/android/debug/*.apk | head -1)
          out="gen1recomp-fold-${GITHUB_RUN_NUMBER}.apk"
          cp "$src" "$out"
          echo "file=$out" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: gen1recomp-fold-apk
          path: ${{ steps.apk.outputs.file }}

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: gen1recomp Fold build ${{ github.run_number }}
          body: |
            Built from ${{ github.sha }} (${{ github.ref_name }}).
            Download the .apk below on the phone and install it.
          files: ${{ steps.apk.outputs.file }}
          make_latest: true
