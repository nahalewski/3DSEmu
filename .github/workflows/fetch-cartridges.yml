name: Fetch cartridge art and HOME Menu sprites

# Collects cartridge photos (and the rest of each game's art, just in case)
# for the 3D cartridges on the 3DS theme's top screen, and commits them to
# the cartridge-art branch:
#   * LaunchBox Games Database: its published Metadata.zip lists every image
#     of every game; all images of the Pokemon Game Boy / Color / Advance
#     games are downloaded from images.launchbox-app.com (Cart - Front,
#     Cart - Back, Cart - 3D, boxes...).
#   * GameTDB: the art for 3DS title ECLP.
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/fetch-cartridges.yml

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Download
        run: |
          mkdir -p art/launchbox art/gametdb
          python3 - <<'PY'
          import io, os, re, time, urllib.error, urllib.parse, urllib.request, zipfile
          import xml.etree.ElementTree as ET
          UA = {"User-Agent": "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36"}
          def get(url, timeout=300):
              return urllib.request.urlopen(urllib.request.Request(url, headers=UA), timeout=timeout).read()

          # ---- LaunchBox
          log = []
          def status(url):
              try:
                  r = urllib.request.urlopen(urllib.request.Request(url, headers=UA), timeout=60)
                  return r.status
              except urllib.error.HTTPError as e:
                  return e.code
              except Exception as e:
                  return str(e)
          for u in ["https://gamesdb.launchbox-app.com/", "https://gamesdb.launchbox-app.com/Metadata.zip",
                    "https://images.launchbox-app.com/", "https://gamesdb.launchbox-app.com/games/search?search=pokemon"]:
              log.append("STATUS\t%s\t%s" % (u, status(u)))
              print(log[-1])
          data = None
          for attempt in range(4):
              try:
                  data = get("https://gamesdb.launchbox-app.com/Metadata.zip", 900)
                  break
              except Exception as e:
                  print("Metadata.zip attempt", attempt, e)
                  time.sleep(30)
          try:
              if data is None:
                  raise RuntimeError("Metadata.zip unavailable")
              print("Metadata.zip", len(data))
              z = zipfile.ZipFile(io.BytesIO(data))
              xmlname = [n for n in z.namelist() if n.lower().endswith("metadata.xml")][0]
              root = ET.fromstring(z.read(xmlname))
              platforms = {"Nintendo Game Boy", "Nintendo Game Boy Color", "Nintendo Game Boy Advance"}
              # every release, the Japanese ones too (Pocket Monsters Aka / Midori /
              # Ao / Pikachu / Kin / Gin / Crystal, FireRed / LeafGreen), however
              # the database spells or scripts them
              want = re.compile(r"pok[eé]mon|pocket ?monsters?|poketto|ポケットモンスター|ポケモン", re.I)
              games = {}
              alt = {}
              for a in root.iter("GameAlternateName"):
                  alt.setdefault(a.findtext("DatabaseID"), []).append(a.findtext("AlternateName") or "")
              for g in root.iter("Game"):
                  name = (g.findtext("Name") or "")
                  names = [name] + alt.get(g.findtext("DatabaseID"), [])
                  plat = (g.findtext("Platform") or "")
                  if plat in platforms and any(want.search(n) for n in names):
                      games[g.findtext("DatabaseID")] = (name, plat)
              print(len(games), "games")
              for gid, (name, plat) in sorted(games.items(), key=lambda kv: kv[1]):
                  log.append("GAME\t%s\t%s\t%s" % (gid, name, plat))
              n = 0
              for im in root.iter("GameImage"):
                  gid = im.findtext("DatabaseID")
                  if gid not in games:
                      continue
                  fname = im.findtext("FileName") or ""
                  kind = im.findtext("Type") or ""
                  region = im.findtext("Region") or ""
                  name, plat = games[gid]
                  safe = re.sub(r"[^A-Za-z0-9._-]+", "_", "%s__%s__%s__%s" % (name, kind, region, fname))
                  try:
                      open(os.path.join("art/launchbox", safe), "wb").write(get("https://images.launchbox-app.com/" + fname, 120))
                      log.append("IMG\t%s\t%s\t%s\t%s\t%s" % (name, plat, kind, region, safe))
                      n += 1
                  except Exception as e:
                      log.append("SKIP\t%s\t%s\t%s" % (name, fname, e))
                  time.sleep(0.15)
              print(n, "launchbox images")
          except Exception as e:
              print("launchbox failed:", e)
              log.append("LAUNCHBOX FAILED\t%s" % e)
              # the site's own pages: search, each game's images page
              import html as H
              seen = set()
              for q in ["pokemon red", "pokemon blue", "pokemon yellow", "pokemon green", "pokemon gold",
                        "pokemon silver", "pokemon crystal", "pokemon firered", "pokemon leafgreen",
                        "pocket monsters"]:
                  for url in ["https://gamesdb.launchbox-app.com/games/search?search=" + urllib.parse.quote(q),
                              "https://gamesdb.launchbox-app.com/games/results/" + urllib.parse.quote(q)]:
                      try:
                          page = get(url, 60).decode("utf-8", "replace")
                      except Exception as e2:
                          log.append("SEARCH FAILED\t%s\t%s" % (url, e2))
                          continue
                      for gid in re.findall(r"/games/details/(\d+)", page):
                          if gid in seen:
                              continue
                          seen.add(gid)
                          try:
                              ip = get("https://gamesdb.launchbox-app.com/games/images/" + gid, 60).decode("utf-8", "replace")
                          except Exception as e3:
                              log.append("IMAGES FAILED\t%s\t%s" % (gid, e3))
                              continue
                          title = H.unescape((re.findall(r"<title>([^<]*)", ip) or [gid])[0])
                          for src in set(re.findall(r"https://images\.launchbox-app\.com/[^\"'\s)]+", ip)):
                              safe = re.sub(r"[^A-Za-z0-9._-]+", "_", "%s__%s__%s" % (gid, title[:60], src.rsplit("/", 1)[-1]))
                              try:
                                  open(os.path.join("art/launchbox", safe), "wb").write(get(src, 120))
                                  log.append("IMG\t%s\t%s\t%s" % (title, src, safe))
                              except Exception:
                                  pass
                              time.sleep(0.1)
                      time.sleep(0.5)

          # ---- GameTDB: 3DS ECLP (every art kind and region it may have)
          for kind in ["cover", "coverHQ", "coverM", "coverfull", "coverfullHQ", "box", "cart", "cartHQ", "disc", "3D"]:
              for region in ["US", "EN", "JA", "FR", "DE", "ES", "IT", "NL", "KO"]:
                  for ext in ["jpg", "png"]:
                      url = "https://art.gametdb.com/3ds/%s/%s/ECLP.%s" % (kind, region, ext)
                      try:
                          body = get(url, 30)
                          name = "ECLP_%s_%s.%s" % (kind, region, ext)
                          open(os.path.join("art/gametdb", name), "wb").write(body)
                          log.append("GAMETDB\t%s" % name)
                      except Exception:
                          pass
          try:
              open("art/gametdb/ECLP.html", "wb").write(get("https://www.gametdb.com/3DS/ECLP", 60))
          except Exception as e:
              log.append("GAMETDB PAGE FAILED\t%s" % e)
          # ---- The Spriters Resource: 3DS System / BIOS sheets (the HOME Menu
          # and friends), all but the sound and Mii ones
          os.makedirs("art/spriters", exist_ok=True)
          base = "https://www.spriters-resource.com"
          try:
              page = get(base + "/3ds/systembios/", 60).decode("utf-8", "replace")
              log.append("SPRITERS STATUS\tok\t%d bytes" % len(page))
              links = re.findall(r'href="(/3ds/systembios/(?:sheet|asset)/(\d+)/?)"[^>]*>(.*?)</a>', page, re.S)
              seen = set()
              for href, sid, inner in links:
                  if sid in seen:
                      continue
                  seen.add(sid)
                  title = re.sub(r"<[^>]+>", " ", inner)
                  title = re.sub(r"\s+", " ", title).strip()
                  if re.search(r"sound|mii", title, re.I):
                      log.append("SPRITERS SKIP\t%s\t%s" % (sid, title))
                      continue
                  try:
                      sheet = get(base + href, 60).decode("utf-8", "replace")
                      t2 = re.findall(r"<title>([^<]*)", sheet)
                      if t2 and re.search(r"sound|mii", t2[0], re.I):
                          log.append("SPRITERS SKIP\t%s\t%s" % (sid, t2[0]))
                          continue
                      srcs = set(re.findall(r'(?:src|href)="((?:https://www\.spriters-resource\.com)?/(?:resources/sheets|media/assets|download)/[^"]+)"', sheet))
                      got = 0
                      for src in srcs:
                          url = src if src.startswith("http") else base + src
                          try:
                              body = get(url, 120)
                              ext = ".zip" if body[:2] == b"PK" else ".png" if body[:4] == b"\x89PNG" else ".gif" if body[:3] == b"GIF" else ".bin"
                              name = re.sub(r"[^A-Za-z0-9._-]+", "_", "%s__%s__%s" % (sid, (t2[0] if t2 else title)[:60], url.rstrip("/").rsplit("/", 1)[-1]))
                              if not name.endswith(ext):
                                  name += ext
                              open(os.path.join("art/spriters", name), "wb").write(body)
                              got += 1
                          except Exception:
                              pass
                          time.sleep(0.3)
                      log.append("SPRITERS\t%s\t%s\t%d files" % (sid, t2[0] if t2 else title, got))
                  except Exception as e:
                      log.append("SPRITERS FAILED\t%s\t%s" % (sid, e))
                  time.sleep(0.5)
          except Exception as e:
              log.append("SPRITERS STATUS\tfailed\t%s" % e)
          open("art/INDEX.tsv", "w").write("\n".join(log) + "\n")
          PY
          find art -type f | wc -l
          du -sh art
      - name: Commit to the cartridge-art branch
        run: |
          cd art
          git init -q
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout -q -b cartridge-art
          git add -A
          git commit -qm "Cartridge art: LaunchBox Games Database (Pokemon GB / GBC / GBA) and GameTDB ECLP"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" cartridge-art
